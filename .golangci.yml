version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    # A client whose whole job is holding a bearer token and writing files gets
    # the security linter as a gate, not as an occasional audit.
    - gosec
    # Cheap correctness/hygiene linters that catch real classes of bug rather
    # than style opinions.
    - bodyclose # a leaked HTTP body is a leaked connection
    - errorlint # %w / errors.Is instead of == on wrapped errors
    - noctx # every outbound call must carry a context (cancellable, timeout-able)
    - unconvert # redundant conversions
    - misspell
  settings:
    gosec:
      excludes:
        # G104 duplicates errcheck, which already runs with the presets below.
        - G104
  exclusions:
    presets:
      # Ignore the well-known safe unchecked errors (fmt.Fprint to stdout,
      # deferred Close, etc.); real error handling is still checked.
      - std-error-handling
    rules:
      # Test helpers deliberately ignore setup errors for brevity.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # The local WebDAV endpoint intentionally serves plain HTTP on loopback
      # (the OS mount clients speak http://127.0.0.1), and the temp files that
      # back a transfer are created by os.CreateTemp with default 0600 perms.
      # Both are documented decisions, not oversights.
      - path: cmd/files_webdav\.go
        linters:
          - gosec
      - path: internal/webdavfs/handles\.go
        text: "G304|G302|G306"
        linters:
          - gosec
      # The tray launches one subprocess with a computed argument: rundll32 with
      # the configured server URL, which is scheme-validated first. It is an
      # argv-array call — no shell parses it — and the URL comes from this
      # program's own stored session, not from the network.
      - path: cmd/ledgerline-gui/main_windows\.go
        text: "G204"
        linters:
          - gosec
      # Download/upload paths open a caller-supplied destination by design; the
      # path comes from the user's own command line, not from the server.
      - path: cmd/(files|gallery|files_shared|files_archive)\.go
        text: "G304"
        linters:
          - gosec
      # The credential file and the upload ledger live at paths this client
      # derives itself (config.Dir + a fixed file name, or an explicit
      # LEDGERLINE_CLI_CONFIG_DIR the user set); the server never influences
      # them, so the "file inclusion via variable" and taint findings here are
      # about our own config location, not untrusted input.
      - path: internal/(session/session|uploadledger/ledger|config/config|installid/installid|syncconfig/syncconfig)\.go
        text: "G304|G703"
        linters:
          - gosec
      # The application log is meant to be read: it lives in a directory the
      # installer creates beside the programs and grants the machine's users
      # write access to, precisely so a person can open it without hunting
      # through AppData. 0600 would defeat that, and the file holds no secret —
      # events and error messages, never a token, password or code. The path is
      # this program's own (its executable directory, or its config directory),
      # not anything the server or the network supplies.
      - path: internal/applog/applog\.go
        text: "G301|G302|G304|G306"
        linters:
          - gosec
      # gen-icon writes a build artefact (the .ico the resource compiler and the
      # installer consume) to a path given on the command line.
      - path: cmd/gen-icon/main\.go
        text: "G301|G306"
        linters:
          - gosec
      # internal/win32ui is nothing but syscall marshalling: every window API
      # takes a pointer as a uintptr and sizes as int32, so unsafe.Pointer
      # conversions (G103) and the int/int32/uintptr traffic (G115) are the
      # interface, not a lapse. Sizes come from this program's own layout
      # constants and the system DPI, never from the network. Real error
      # handling in the package is still checked.
      - path: internal/win32ui/.*\.go
        text: "G103|G115"
        linters:
          - gosec
      # internal/deskui frames the WebView2 window: the DWM attribute calls and
      # the icon lookup pass pointers as uintptr because that is the shape of
      # the API. The values are this program's own constants and its own
      # executable path, never anything received.
      - path: internal/deskui/.*\.go
        text: "G103|G115"
        linters:
          - gosec
      # internal/deskpower asks Windows two questions — mains power, and whether
      # the connection is metered — through a struct pointer and a COM vtable.
      # Both are pointers to this program's own stack values; nothing here comes
      # from outside the process.
      - path: internal/deskpower/.*\.go
        text: "G103|G115"
        linters:
          - gosec
      # The clipboard is the one place a share link can go, and the Win32 API
      # for it takes a locked global handle and a pointer to our own UTF-16
      # buffer. Nothing crosses a trust boundary here.
      - path: cmd/ledgerline-gui/clipboard_windows\.go
        text: "G103"
        linters:
          - gosec
      # The sync engine opens files under the local directory the user named on
      # the command line; that is the whole point of a sync root. Same for the
      # chunked uploader (a path the caller passed) and the audit-log reader (a
      # path this client owns under its config dir).
      - path: internal/files/sync\.go
        text: "G304"
        linters:
          - gosec
      - path: (internal/api/files_chunked|cmd/audit|cmd/files_versions)\.go
        text: "G304"
        linters:
          - gosec
