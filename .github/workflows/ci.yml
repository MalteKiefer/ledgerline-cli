name: CI

# Build, vet, format-check, test and vulnerability-scan on every push and pull
# request. Release artefacts are produced separately by release.yml on a tag.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify (vet, gofmt, tests)
        run: make check

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: SBOM up to date
        run: make sbom-verify

      - name: Reproducible build
        run: make repro-verify
