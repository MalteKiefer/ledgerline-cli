name: Release

# On every version tag (vMAJOR.MINOR.PATCH) this workflow re-runs the full gate
# (tests, race detector, lint, vulnerability scan, supply-chain checks), then
# cross-compiles the Linux/macOS/Windows binaries, builds the .deb and .rpm
# packages, checksums and signs everything and publishes a GitHub release with
# the CHANGELOG section as the notes.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Dry run: the whole pipeline can be exercised from a branch without
  # publishing anything. Only the final "Create GitHub release" step is
  # tag-gated, so a broken packaging or signing step is found here rather than
  # halfway through a real release.
  workflow_dispatch:

# Least privilege by default; the jobs below elevate only what they need.
permissions:
  contents: read

jobs:
  verify:
    # A tag must not be publishable if the code cannot pass the same gate a pull
    # request has to pass — including on the non-Linux targets we ship.
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build every package
        run: go build ./...

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...

  gate:
    name: Lint, security, supply chain
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (echo "gofmt needed on:" && gofmt -l . && exit 1)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: go.mod tidy + module checksums
        run: make tidy-verify

      - name: SBOM up to date
        run: make sbom-verify

      - name: Reproducible build
        run: make repro-verify

  release:
    name: Build and publish
    needs: [verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless signing / build provenance (OIDC)
      attestations: write # record the provenance attestation
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          # Full history + tags so `git describe` stamps the exact version.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true

      # Cross-compiles Linux/macOS/Windows binaries (Windows as a plain .exe),
      # then wraps the Linux ones into .deb and .rpm via the pinned nfpm.
      - name: Cross-compile binaries and build Linux packages
        run: make package

      - name: Generate checksums
        working-directory: dist
        run: sha256sum ledgerline-cli-* ledgerline-cli_* > checksums.txt

      # Provenance is only meaningful for a published artefact, and the
      # attestation API rejects a non-tag ref, so a dry run skips it.
      - name: Attest build provenance
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/ledgerline-cli-*
            dist/ledgerline-cli_*

      # cosign-installer publishes no moving major tag; pin the exact release.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign checksums (keyless)
        working-directory: dist
        run: |
          cosign sign-blob --yes checksums.txt \
            --output-signature checksums.txt.sig \
            --output-certificate checksums.txt.pem

      - name: Extract release notes from CHANGELOG
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { flag = 1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            printf 'Release %s\n' "$TAG" > release-notes.md
          fi

      # Guarded so a workflow_dispatch dry run builds, checksums, attests and
      # signs everything but publishes nothing.
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            dist/ledgerline-cli-* dist/ledgerline-cli_* dist/checksums.txt \
            dist/checksums.txt.sig dist/checksums.txt.pem
